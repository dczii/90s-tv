name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs with no Android SDK and never resolves anything from Google's Maven. This job
  # has no `needs:` on purpose: `:core` is the module that holds all the hard logic, and
  # it must stay verifiable in environments where the Android build cannot run at all
  # (ARCHITECTURE.md §3, §13).
  core-tests:
    name: ":core tests (no Android SDK)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run :core tests
        run: ./gradlew :core:test --stacktrace

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  android-build:
    name: "Build :core and :app"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble both modules
        run: ./gradlew :core:assemble :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
